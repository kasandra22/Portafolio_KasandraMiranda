<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- fragmento 1 para Agregar constante en ventana modal -->
<section th:fragment="agregar">
    <!-- Button trigger modal -->
    <div class='row py-4 mb-2 bg-light'>
        <div class='col-md-1'></div>
        <div class='col-md-3'>
            <button type="button" class="btn btn-primary"
                    sec:authorize="hasRole('ROLE_ADMIN')"
                    data-bs-toggle="modal" data-bs-target="#agregarConstanteModal">
                <i class="fa-solid fa-plus"></i> [[#{constante.agregar}]]</button>
        </div>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="agregarConstanteModal" tabindex="-1"
         aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">
                        <i class="fa-solid fa-layer-group"></i> [[#{constante.agregar}]]</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action='@{/constante/guardar}' th:object='${constante}'
                      class='was-validated' method='post'>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="atributo">[[#{constante.atributo}]]</label>
                            <input type="text" class="form-control"
                                   name="atributo" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label for="valor">[[#{constante.valor}]]</label>
                            <input type="text" class="form-control"
                                   name="valor" required="true"/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- fragmento 2 para Listado de constantes -->
<section th:fragment="listado">
    <div class="row py-2">
        <div class="col-md-10 offset-md-1">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>[[#{constante.atributo}]]</th>
                        <th>[[#{constante.valor}]]</th>
                        <th>[[#{accion.acciones}]]</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="constante : ${constantes}">
                        <td th:text="${constante.atributo}"></td>
                        <td th:text="${constante.valor}"></td>
                        <td>
                            <a th:href="@{/constante/modificar/{id}(id=${constante.idConstante})}"
                               class="btn btn-sm btn-warning">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <button type="button" class="btn btn-sm btn-danger"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#eliminarConstanteModal-' + ${constante.idConstante}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- fragmento 3 para Confirmar Eliminar constante en ventana modal -->
<section th:fragment="confirmarEliminar">
    <div th:each="constante : ${constantes}">
        <div class="modal fade" th:id="'eliminarConstanteModal-' + ${constante.idConstante}" tabindex="-1"
             aria-labelledby="eliminarConstanteModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-md">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h1 class="modal-title fs-5" id="eliminarConstanteModalLabel">
                            <i class="fa-solid fa-triangle-exclamation"></i> [[#{constante.eliminar}]]</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>[[#{constante.confirmarEliminar}]] <strong th:text="${constante.atributo}"></strong>?</p>
                    </div>
                    <form th:action="@{/constante/eliminar}" method="post">
                        <input type="hidden" name="idConstante" th:value="${constante.idConstante}"/>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]</button>
                            <button type="submit" class="btn btn-danger">
                                <i class="fa-solid fa-trash"></i> [[#{accion.eliminar}]]</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- fragmento 4 para Editar constante (página completa, no modal) -->
<section th:fragment="editar">
    <div class="row py-4">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h1 class="fs-5 mb-0">
                        <i class="fa-solid fa-pen"></i> [[#{constante.editar}]]</h1>
                </div>
                <div class="card-body">
                    <form th:action="@{/constante/guardar}" th:object="${constante}"
                          class="was-validated" method="post">
                        <input type="hidden" th:field="*{idConstante}"/>
                        <div class="mb-3">
                            <label for="atributo">[[#{constante.atributo}]]</label>
                            <input type="text" class="form-control"
                                   th:field="*{atributo}" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label for="valor">[[#{constante.valor}]]</label>
                            <input type="text" class="form-control"
                                   th:field="*{valor}" required="true"/>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/constante/listado}" class="btn btn-secondary">
                                <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
